[package]
name = "foundry-acp"
version = "0.1.0"
edition = "2021"
description = "Agent Communication Protocol (ACP) server for Foundry Local"
license = "MIT"

[features]
default = []
windows-service = ["dep:windows-service"]
tls = ["dep:axum-server", "dep:rustls", "dep:rustls-pemfile"]

[dependencies]
foundry-local-sdk = { path = "../../../sdk/rust" }
axum = { version = "0.8", features = ["json"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs-next = "2"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
foundry-local-sdk = { path = "../../../sdk/rust", features = ["winml"] }
windows-service = { version = "0.7", optional = true }

[[test]]
name = "acp_integration"
path = "tests/acp_integration.rs"
